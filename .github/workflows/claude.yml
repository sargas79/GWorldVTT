name: Claude Code Action

on:
  issues:
    types: [opened, edited, assigned]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, synchronize]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  claude:
    # Only when @claude is actually asked for. On a pull_request event
    # github.event.issue is null, and contains(null, ...) is false, so each
    # clause only fires for the event that carries that field.
    if: >-
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.pull_request.body, '@claude')
    runs-on: ubuntu-latest

    # This repository's default workflow token is read-only, so without these
    # the action runs and then cannot post what it worked out.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
